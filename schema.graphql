"""
Схема GraphQL для сервиса «Волонтеры» (DataSpace Community Edition)
Хакатон ВЕСНА '25 | ДГТУ
"""

enum EventStatus {
  CREATED     # Создано организатором, ожидает модерации администратора
  ACCEPTED    # Согласовано администратором, доступно для волонтеров
  CANCELLED   # Отклонено администратором или отменено организатором
  CLOSED      # Завершено организатором после проведения
}

enum RequestStatus {
  PENDING     # Заявка подана волонтером, ожидает решения организатора
  ACCEPTED    # Заявка согласована организатором
  CANCELLED   # Заявка отклонена организатором или отменена волонтером
  CONFIRMED   # Факт работы подтвержден организатором с начислением часов
}

enum UserRole {
  ADMIN       # Администратор сервиса
  ORGANIZER   # Организатор событий
  VOLUNTEER   # Волонтёр (студент)
}

type User {
  id: ID!
  firstName: String!
  lastName: String!
  email: String!
  role: UserRole!
  createdAt: String!
}

type AuthPayload {
  token: String!
  user: User!
}

type Organization {
  id: ID!
  name: String!
  inn: String
  contactPerson: String!
  email: String!
  phone: String!
  description: String
  createdAt: String!
  events: [Event!]
}

type Volonteer {
  id: ID!
  fullName: String!
  email: String!
  phone: String!
  birthDate: String
  studentId: String
  faculty: String
  totalConfirmedHours: Float!
  createdAt: String!
  requests: [VolonteerEventRequest!]
}

type Event {
  id: ID!
  title: String!
  description: String!
  location: String!
  startDate: String!
  endDate: String!
  requiredVolunteers: Int!
  plannedHours: Float!
  status: EventStatus!
  organizationId: ID!
  organization: Organization!
  requests: [VolonteerEventRequest!]
  createdAt: String!
  reviews: [EventReview!]
  ratingAvg: Float    # Средняя оценка по отзывам
  reviewsCount: Int!
}

type VolonteerEventRequest {
  id: ID!
  volonteerId: ID!
  volonteer: Volonteer!
  eventId: ID!
  event: Event!
  status: RequestStatus!
  requestedHours: Float!
  confirmedHours: Float
  rejectionReason: String
  createdAt: String!
  updatedAt: String!
}

# Отзыв волонтёра о проведённом мероприятии (1 отзыв на участника)
type EventReview {
  id: ID!
  eventId: ID!
  event: Event!
  volonteerId: ID!
  volonteer: Volonteer!
  authorName: String!
  rating: Int! # 1..5
  text: String!
  createdAt: String!
  updatedAt: String
}

enum MapMarkerType {
  REGULAR        # Волонтёрская помощь
  SEARCH_RESCUE  # Поисково-спасательная операция (ПСО)
}

enum MapMarkerStatus {
  ACTIVE
  PENDING_APPROVAL # Отчёт о закрытии ПСО на согласовании
  FOUND
  CLOSED
}

enum Urgency {
  HIGH
  MEDIUM
  LOW
}

type ClosureProof {
  photo: String!
  note: String!
  targetStatus: MapMarkerStatus!
  submittedBy: ID!
  submittedByName: String!
  submittedAt: String!
  approvedAt: String
  approvedBy: String
  rejectedAt: String
  rejectReason: String
}

type MapMarker {
  id: ID!
  type: MapMarkerType!
  status: MapMarkerStatus!
  title: String!
  description: String!
  lat: Float!
  lng: Float!
  urgency: Urgency!
  contactPhone: String
  lastSeenDate: String
  lastSeenLocation: String
  photos: [String!]! # Фото, прикреплённые при создании метки ПСО (до 5, URL или data URL)
  closureProof: ClosureProof
  createdBy: ID!
  createdByName: String!
  createdAt: String!
}

input MapMarkerInput {
  type: MapMarkerType!
  title: String!
  description: String!
  lat: Float!
  lng: Float!
  urgency: Urgency!
  contactPhone: String
  lastSeenDate: String
  lastSeenLocation: String
  photos: [String!]
}

type StatementReport {
  volonteer: Volonteer!
  startDate: String!
  endDate: String!
  totalHours: Float!
  closedEventsCount: Int!
  items: [StatementReportItem!]!
}

type StatementReportItem {
  eventName: String!
  organizationName: String!
  eventDate: String!
  confirmedHours: Float!
}

# Queries
type Query {
  organizations: [Organization!]!
  organization(id: ID!): Organization

  volonteers: [Volonteer!]!
  volonteer(id: ID!): Volonteer

  events(status: EventStatus): [Event!]!
  event(id: ID!): Event
  availableEvents: [Event!]! # Event = ACCEPTED

  requests(volonteerId: ID, eventId: ID, status: RequestStatus): [VolonteerEventRequest!]!
  request(id: ID!): VolonteerEventRequest

  # Авторизация и профиль
  me: User
  users: [User!]!

  # Выписка об отработанных часах на закрытых событиях (CONFIRMED) за период
  volonteerStatement(volonteerId: ID!, startDate: String!, endDate: String!): StatementReport!

  # Отзывы и карта
  eventReviews(eventId: ID!): [EventReview!]!
  mapMarkers(type: MapMarkerType): [MapMarker!]!
}

# Mutations
type Mutation {
  # Аутентификация (JWT)
  register(
    firstName: String!
    lastName: String!
    email: String!
    password: String!
    role: UserRole!
  ): AuthPayload!

  login(
    email: String!
    password: String!
  ): AuthPayload!

  # Администратор
  registerOrganization(
    name: String!
    contactPerson: String!
    email: String!
    phone: String!
    inn: String
    description: String
  ): Organization!

  registerVolonteer(
    fullName: String!
    email: String!
    phone: String!
    studentId: String
    faculty: String
    birthDate: String
  ): Volonteer!

  moderateEvent(
    eventId: ID!
    status: EventStatus! # ACCEPTED | CANCELLED
  ): Event!

  # Организатор
  createEvent(
    title: String!
    description: String!
    location: String!
    startDate: String!
    endDate: String!
    requiredVolunteers: Int!
    plannedHours: Float!
    organizationId: ID!
  ): Event!

  moderateRequest(
    requestId: ID!
    status: RequestStatus! # ACCEPTED | CANCELLED
    rejectionReason: String
  ): VolonteerEventRequest!

  confirmVolunteerWork(
    requestId: ID!
    confirmedHours: Float!
  ): VolonteerEventRequest!

  closeEvent(
    eventId: ID!
  ): Event!

  # Волонтёр
  submitEventRequest(
    volonteerId: ID!
    eventId: ID!
  ): VolonteerEventRequest!

  cancelEventRequest(
    requestId: ID!
  ): VolonteerEventRequest!

  # Отзыв участника (создаёт или обновляет собственный отзыв).
  # Доступно, если заявка CONFIRMED или ACCEPTED на закрытом событии.
  submitEventReview(
    eventId: ID!
    volonteerId: ID!
    rating: Int!
    text: String!
  ): EventReview!

  # Администратор (модерация) или автор отзыва
  deleteEventReview(
    reviewId: ID!
  ): Boolean!

  # Карта: метка с фотографиями (фото принимаются только для SEARCH_RESCUE)
  createMapMarker(
    input: MapMarkerInput!
  ): MapMarker!
}
