type AuthPayload {
	"""
	Токен возвращается только если клиент попросил его заголовком `X-Token-Response: 1`
	(не-браузерные клиенты). Браузер получает его в HttpOnly-cookie и до JS он не доходит.
	"""
	token: String
	user: User!
	expiresAt: String!
}

type ClosureProof {
	"""
	Ссылка на фото отчёта (отдаётся только авторизованным) либо пустая строка.
	"""
	photo: String!
	note: String!
	targetStatus: MapMarkerStatus!
	submittedBy: ID
	submittedByName: String!
	submittedAt: String!
	approvedAt: String
	approvedBy: String
	rejectedAt: String
	rejectReason: String
}

type Event {
	id: ID!
	title: String!
	description: String!
	location: String!
	"""
	Дата начала по Москве, ГГГГ-ММ-ДД (совместимость с фронтом).
	"""
	startDate: String!
	endDate: String!
	"""
	Момент начала/окончания — Event.startDateTime / endDateTime из модели (RFC 3339, UTC).
	"""
	startDateTime: String!
	endDateTime: String!
	requiredVolunteers: Int!
	plannedHours: Float!
	status: EventStatus!
	"""
	Причина отмены (только у отменённых событий).
	"""
	cancelReason: String
	organizationId: ID!
	organizationName: String!
	requestsCount: Int!
	approvedVolunteersCount: Int!
	ratingAvg: Float
	reviewsCount: Int!
	createdAt: String!
	organization: Organization!
	requests: [VolonteerEventRequest!]!
	reviews: [EventReview!]!
}

type EventReview {
	id: ID!
	eventId: ID!
	volonteerId: ID!
	authorName: String!
	rating: Int!
	text: String!
	createdAt: String!
	updatedAt: String
	event: Event!
	volonteer: Volonteer!
}

enum EventStatus {
	DRAFT
	ACCEPTED
	CANCELLED
	CLOSED
}

type MapMarker {
	id: ID!
	type: MapMarkerType!
	status: MapMarkerStatus!
	title: String!
	description: String!
	lat: Float!
	lng: Float!
	urgency: Urgency!
	contactPhone: String
	lastSeenDate: String
	lastSeenLocation: String
	"""
	Ссылки вида /media/photos/{id}; сами файлы лежат в PostgreSQL.
	"""
	photos: [String!]!
	"""
	Фото на проверке у администратора: видны только автору и администраторам.
	"""
	pendingPhotos: [String!]!
	closureProof: ClosureProof
	createdBy: ID
	createdByName: String!
	createdAt: String!
}

input MapMarkerInput {
	type: MapMarkerType!
	title: String!
	description: String!
	lat: Float!
	lng: Float!
	urgency: Urgency!
	contactPhone: String
	lastSeenDate: String
	lastSeenLocation: String
	"""
	До 5 изображений в виде data URL (JPEG/PNG/WebP). Сервер перекодирует их и удалит EXIF.
	"""
	photos: [String!]
}

enum MapMarkerStatus {
	ACTIVE
	PENDING_APPROVAL
	FOUND
	CLOSED
}

enum MapMarkerType {
	REGULAR
	SEARCH_RESCUE
}

type Mutation {
	"""
	Регистрация волонтёра или организатора. `consent` — согласие на обработку персональных данных (обязательно).
	Для организатора можно указать название организации.
	"""
	register(firstName: String!, lastName: String!, email: String!, password: String!, role: UserRole!, consent: Boolean!, organizationName: String): AuthPayload!
	login(email: String!, password: String!): AuthPayload!
	"""
	Завершает все сессии пользователя (token_version++), очищает cookie.
	"""
	logout: Boolean!
	"""
	Письмо со ссылкой для нового пароля. Ответ всегда одинаков — по нему нельзя узнать, зарегистрирован ли адрес.
	"""
	requestPasswordReset(email: String!): Boolean!
	"""
	Новый пароль по токену из письма (токен одноразовый, живёт 1 час). Все прежние сессии отзываются.
	"""
	resetPassword(token: String!, newPassword: String!): Boolean!
	"""
	Подтверждение электронной почты по токену из письма.
	"""
	verifyEmail(token: String!): Boolean!
	"""
	Повторно отправить письмо для подтверждения почты (не чаще раза в минуту).
	"""
	resendVerification: Boolean!
	changePassword(oldPassword: String!, newPassword: String!): Boolean!
	"""
	Волонтёр правит свой профиль; передаются только изменяемые поля (пустая строка очищает факультет и номер билета).
	"""
	updateMyProfile(firstName: String, lastName: String, phone: String, faculty: String, studentId: String): Volonteer!
	"""
	Все данные пользователя о нём самом в виде JSON (право на доступ к данным, 152-ФЗ).
	"""
	exportMyData: String!
	"""
	Удаление учётной записи с немедленным обезличиванием персональных данных. Требует пароль.
	"""
	deleteMyAccount(password: String!): Boolean!
	registerOrganization(name: String!, contactPerson: String!, email: String!, phone: String!, inn: String, description: String): Organization!
	registerVolonteer(fullName: String!, email: String!, phone: String!, studentId: String, faculty: String, birthDate: String): Volonteer!
	"""
	DRAFT → ACCEPTED | CANCELLED
	"""
	moderateEvent(eventId: ID!, status: EventStatus!): Event!
	createEvent(title: String!, description: String!, location: String!, startDate: String!, endDate: String!, requiredVolunteers: Int!, plannedHours: Float!, organizationId: ID!): Event!
	"""
	OPEN → ACCEPTED | CANCELLED; ACCEPTED → CANCELLED (отзыв принятой заявки)
	"""
	moderateRequest(requestId: ID!, status: RequestStatus!, rejectionReason: String): VolonteerEventRequest!
	"""
	ACCEPTED → CONFIRMED (часы проставляются атомарно)
	"""
	confirmVolunteerWork(requestId: ID!, confirmedHours: Float!): VolonteerEventRequest!
	"""
	DRAFT | ACCEPTED → CANCELLED. Заявки принятого события отменяются автоматически.
	"""
	cancelEvent(eventId: ID!, reason: String): Event!
	"""
	ACCEPTED → CLOSED
	"""
	closeEvent(eventId: ID!): Event!
	submitEventRequest(volonteerId: ID!, eventId: ID!, description: String): VolonteerEventRequest!
	"""
	OPEN | ACCEPTED → CANCELLED (волонтёр отказывается от участия)
	"""
	cancelEventRequest(requestId: ID!): VolonteerEventRequest!
	submitEventReview(eventId: ID!, volonteerId: ID!, rating: Int!, text: String!): EventReview!
	deleteEventReview(reviewId: ID!): Boolean!
	createMapMarker(input: MapMarkerInput!): MapMarker!
	"""
	ACTIVE → PENDING_APPROVAL: отчёт с фото о завершении ПСО.
	"""
	requestMarkerClose(markerId: ID!, photo: String, note: String!, targetStatus: MapMarkerStatus!): MapMarker!
	"""
	Администратор одобряет фото метки: оно становится видно всем.
	"""
	approvePhoto(photoId: ID!): MapMarker!
	"""
	Администратор отклоняет фото метки: оно удаляется.
	"""
	rejectPhoto(photoId: ID!, reason: String): MapMarker!
	approveMarkerClose(markerId: ID!): MapMarker!
	rejectMarkerClose(markerId: ID!, reason: String): MapMarker!
	"""
	Закрытие метки (автор или администратор). Закрытая метка ПСО удаляется сразу.
	"""
	closeMapMarker(markerId: ID!): MapMarker!
	deleteMapMarker(markerId: ID!): Boolean!
}

type Organization {
	id: ID!
	name: String!
	description: String
	"""
	Контакты видны администратору и организатору этой организации.
	"""
	inn: String
	contactPerson: String
	email: String
	phone: String
	createdAt: String!
	events: [Event!]!
}

"""
Фото в очереди модерации (только администратор).
"""
type PhotoModerationItem {
	id: ID!
	markerId: ID!
	markerTitle: String!
	url: String!
	uploadedByName: String
	createdAt: String!
}

type Query {
	"""
	Текущий пользователь (null для гостя).
	"""
	me: User
	"""
	Сессия: пользователь и срок действия.
	"""
	session: Session
	"""
	Версия действующей политики обработки персональных данных.
	"""
	privacyPolicyVersion: String!
	"""
	Настроена ли отправка писем (восстановление пароля, подтверждение почты).
	"""
	mailEnabled: Boolean!
	"""
	Список учётных записей — только администратор.
	"""
	users: [User!]!
	organizations: [Organization!]!
	organization(id: ID!): Organization
	volonteers: [Volonteer!]!
	volonteer(id: ID!): Volonteer
	events(status: EventStatus): [Event!]!
	event(id: ID!): Event
	"""
	События, на которые можно подать заявку (ACCEPTED).
	"""
	availableEvents: [Event!]!
	requests(volonteerId: ID, eventId: ID, status: RequestStatus): [VolonteerEventRequest!]!
	request(id: ID!): VolonteerEventRequest
	"""
	Выписка о подтверждённых часах (заявки CONFIRMED на событиях CLOSED) за период.
	"""
	volonteerStatement(volonteerId: ID!, startDate: String!, endDate: String!): StatementReport!
	"""
	Отзывы: по событию и/или по волонтёру. Публично (автор — только ФИО).
	"""
	reviews(eventId: ID, volonteerId: ID): [EventReview!]!
	eventReviews(eventId: ID!): [EventReview!]!
	"""
	Фото меток, ожидающие проверки (только администратор).
	"""
	photoModerationQueue: [PhotoModerationItem!]!
	mapMarkers(type: MapMarkerType): [MapMarker!]!
}

enum RequestStatus {
	OPEN
	ACCEPTED
	CANCELLED
	CONFIRMED
}

"""
Состояние сессии для клиента.
"""
type Session {
	user: User!
	expiresAt: String!
}

type StatementReport {
	volunteer: Volonteer!
	volonteer: Volonteer!
	startDate: String!
	endDate: String!
	generatedAt: String!
	totalHours: Float!
	closedEventsCount: Int!
	items: [StatementReportItem!]!
}

type StatementReportItem {
	eventName: String!
	organizationName: String!
	eventDate: String!
	location: String!
	confirmedHours: Float!
}

enum Urgency {
	HIGH
	MEDIUM
	LOW
}

type User {
	id: ID!
	firstName: String!
	lastName: String!
	email: String!
	role: UserRole!
	createdAt: String!
	organizationId: ID
	volonteerId: ID
	"""
	Когда пользователь дал согласие на обработку персональных данных (null — не давал).
	"""
	consentAcceptedAt: String
	"""
	Версия политики обработки ПДн, с которой пользователь согласился.
	"""
	consentVersion: String
	"""
	Подтверждён ли адрес электронной почты (по ссылке из письма).
	"""
	emailVerified: Boolean!
}

enum UserRole {
	ADMIN
	ORGANIZER
	VOLUNTEER
}

type Volonteer {
	id: ID!
	fullName: String!
	firstName: String!
	lastName: String!
	"""
	Контакты и дата рождения — только сам волонтёр и администратор;
	email/телефон — ещё и организатор, у которого есть заявка этого волонтёра.
	"""
	email: String
	phone: String
	birthDate: String
	studentId: String
	faculty: String
	totalConfirmedHours: Float!
	createdAt: String!
	requests: [VolonteerEventRequest!]!
}

type VolonteerEventRequest {
	id: ID!
	volonteerId: ID!
	volonteerName: String!
	volonteerFaculty: String
	volonteerStudentId: String
	eventId: ID!
	eventTitle: String!
	eventDate: String!
	eventStatus: EventStatus!
	organizationName: String!
	description: String
	status: RequestStatus!
	requestedHours: Float!
	confirmedHours: Float
	rejectionReason: String
	createdAt: String!
	updatedAt: String!
	volonteer: Volonteer!
	event: Event!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
	mutation: Mutation
}
